name: mobile
description: "A Flutter mobile app for the Turbo Template monorepo."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.6
  cryptography: ^2.7.0
  package_info_plus: ^9.0.1

  # State management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Navigation
  go_router: ^16.3.0
  persistent_bottom_nav_bar_v2: ^6.2.0

  # Code generation annotations
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Environment
  flutter_dotenv: ^6.0.0

  # Error monitoring
  # Configured entirely from --dart-define values (see SentryConstants); the
  # DSN is never bundled as an asset and never logged.
  sentry_flutter: ^9.26.0

  # Secure storage
  flutter_secure_storage: ^10.0.0
  connectivity_plus: ^6.1.5

  # Theming
  flex_color_scheme: ^8.3.1

  # Local storage for preferences
  shared_preferences: ^2.5.3

  # Onboarding
  introduction_screen: ^4.0.0

  # Snackbar notifications
  awesome_snackbar_content: ^0.1.8

  # Toast notifications
  toastification: ^3.0.3

  # Feature tour / showcase
  showcaseview: ^5.0.1

  # Local push notifications
  awesome_notifications: ^0.11.0
  sensors_plus: ^7.1.0
  url_launcher: ^6.3.2

  # DR-1 spoken denomination and authenticity disclaimer. The platform's own
  # speech engine: the module ships no recorded audio and needs none, and a
  # device that has no engine falls back to the on-screen text, which the
  # criteria require to stand on its own anyway.
  flutter_tts: ^4.2.5
  flutter_sceneview: 4.32.0
  permission_handler: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^3.0.0
  json_serializable: ^6.9.4
  riverpod_generator: ^3.0.3
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.3

  # Branding generators. Both are build-time only: they read the
  # full-resolution seal from assets/branding/ and write native Android
  # resources, which are then committed. Neither ships in the app.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# Android launcher icon, generated from the BSP seal.
#
# The adaptive icon is the fiddly part: Android masks it to a circle or
# squircle and only the inner ~66% is guaranteed to survive the crop. The seal
# fills its canvas edge to edge, so without an inset its gold rim is shaved
# off. The inset shrinks the mark into the safe zone and the navy fills behind.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/bsp-logo-source.png"
  adaptive_icon_background: "#1B3665"
  adaptive_icon_foreground: "assets/branding/bsp-logo-source.png"
  adaptive_icon_foreground_inset: 18
  min_sdk_android: 21

# Launch screen. `android_12` is not optional decoration: from Android 12 the
# platform draws the splash itself via the SplashScreen API and ignores the
# legacy launch_background drawable entirely, so without this block the app
# would show a bare white window on any modern device — including the API 37
# emulator this is developed against.
flutter_native_splash:
  color: "#1B3665"
  image: assets/branding/bsp-logo-splash.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#1B3665"
    image: assets/branding/bsp-logo-splash.png
    icon_background_color: "#1B3665"

flutter:
  uses-material-design: true

  # MB-2 / F-42: `.env` is deliberately NOT bundled. A Flutter asset ships
  # inside the APK in cleartext and is readable by unzipping it, so config
  # arrives via --dart-define instead (see ApiConstants).
  assets:
    # The BSP seal. Only the 1x path is declared: Flutter resolves the 2.0x and
    # 3.0x variants beside it automatically. `assets/branding/` is deliberately
    # NOT declared — it holds the full-resolution source used at build time by
    # the launcher-icon and splash generators, and bundling it would ship a
    # ~1 MB image the app never reads.
    - assets/images/bsp-logo.png
    - assets/pisocamp/home.json
    - assets/pisocamp/bundle/seed/manifest.envelope.json
    - assets/pisocamp/bundle/seed/resource-index.json
    - assets/pisocamp/bundle/seed/resources/
    - assets/pisocamp/bundle/seed/source/
