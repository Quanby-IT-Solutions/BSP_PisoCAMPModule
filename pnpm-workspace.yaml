packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  '@better-auth/cli': 1.6.29
  '@eslint/js': ^9.39.2
  '@nestjs/common': ^11.1.19
  '@nestjs/core': ^11.1.19
  '@orpc/contract': ^1.13.4
  '@orpc/nest': ^1.13.4
  '@sentry/nestjs': ^10.70.0
  '@sentry/nextjs': ^10.70.0
  '@t3-oss/env-core': ^0.13.10
  '@t3-oss/env-nextjs': ^0.13.10
  '@tailwindcss/postcss': ^4.1.18
  '@tanstack/eslint-plugin-query': ^5.91.2
  '@tanstack/react-form': ^1.27.7
  '@tanstack/react-query': ^5.90.16
  '@turbo/gen': ^2.7.3
  '@types/node': ^22.19.3
  '@types/pg': ^8.16.0
  '@types/react': 19.2.7
  '@types/react-dom': 19.2.3
  # 1.6.29 rather than 1.7: every advisory is patched by >=1.6.22, and 1.7
  # changes account identity to be scoped by a new required `issuer` column.
  # Taking a schema migration of the auth tables to fix advisories that 1.6
  # already fixes would be trading a known risk for an unknown one.
  better-auth: 1.6.29
  dotenv: ^16.6.1
  drizzle-orm: 1.0.0-beta.9-e89174b
  eslint: ^9.39.2
  nestjs-zod: ^5.1.1
  next: 16.3.4
  pg: ^8.16.3
  prettier: ^3.7.4
  react: 19.2.3
  react-dom: 19.2.3
  tailwindcss: ^4.1.18
  tsx: ^4.21.0
  turbo: ^2.7.3
  typescript: ^5.9.3
  typescript-eslint: ^8.52.0
  zod: ^4.3.5

catalogs:
  react19:
    '@types/react': ^19.2.7
    '@types/react-dom': ^19.2.3
    react: 19.2.3
    react-dom: 19.2.3

linkWorkspacePackages: true

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@scarf/scarf'
  - '@swc/core'
  - argon2
  - better-sqlite3
  - core-js-pure
  - esbuild
  - grpc-tools
  - sharp
  - unrs-resolver

overrides:
  # SA-6. Two transitive packages whose parents pin an exact version the range
  # rules above cannot reach. Same major line, so the API is unchanged.
  'brace-expansion@5.0.7': 5.0.9
  'js-yaml@4.1.1': 4.3.1
  # SA-6. Transitive advisories the generated remediation did not reach,
  # pinned to the smallest patched version on the line already installed.
  '@babel/core@<=7.29.0': '>=7.29.6'
  '@humanfs/node@<0.16.8': '>=0.16.8'
  '@isaacs/brace-expansion@<=5.0.0': '>=5.0.1'
  '@nestjs/core@<=11.1.17': '>=11.1.18'
  '@nestjs/microservices@<=11.1.18': '>=11.1.19'
  '@orpc/client@<=1.13.5': '>=1.13.6'
  '@orpc/openapi@<=1.13.8': '>=1.13.9'
  '@turbo/workspaces@>=2.3.4 <2.9.14': '>=2.9.14'
  '@types/minimatch': 5.1.2
  '@types/react': 19.2.7
  '@types/react-dom': 19.2.3
  '@xhmikosr/decompress@<10.2.1': '>=10.2.1'
  # ajv 6 has no patched release: ">=6.14.0" resolves to 8.x, and
  # @eslint/eslintrc is written against the ajv 6 API, so forcing it breaks
  # linting outright. The advisory is a moderate ReDoS in a dev-only linter
  # dependency, so it is accepted rather than traded for a broken toolchain.
  ajv@>=7.0.0-alpha.0 <8.18.0: '>=8.18.0'
  basic-ftp@<5.2.0: '>=5.2.0'
  basic-ftp@<=5.2.1: '>=5.2.2'
  basic-ftp@<=5.2.2: '>=5.3.0'
  basic-ftp@<=5.3.0: '>=5.3.1'
