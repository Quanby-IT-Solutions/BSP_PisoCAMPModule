  # Scoped to the 11 line on purpose: the generated rule matched uuid 8 as
  # well, and >=11.1.1 resolves to 14.x, which is ESM-only. exceljs is CommonJS
  # and requires uuid@^8, so the blanket rule broke the report export outright.
  # The advisory is a moderate buffer-bounds issue in v3/v5/v6 generation with a
  # caller-supplied buffer, which nothing here does.
  'uuid@>=11.0.0 <11.1.1': '>=11.1.1'
  vite@>=8.0.0 <=8.0.15: '>=8.0.16'
